[project]
name = "ai-build-gpt"
version = "0.1.0"
description = "Tiny GPT built from scratch with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI既定の torch は CUDA 13.2 ビルドで、WSL2 などで GPU 初期化時にセグフォする環境がある。
# CUDA 12.8 ビルドに固定する(macOSはPyPI版が使われる)。
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
